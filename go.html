<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<!--
  ============================================================================
  SENTINEL / Stellar Inc. — Repointable redirect  (go.html)
  Deploys at:  stellarclinical.com/go   (this is the URL the QR encodes)
  Forwards to: /intake
  ----------------------------------------------------------------------------
  WHY THIS EXISTS: the printed QR points at this stable /go URL, never
  directly at the form. To change where the QR leads later (new form host, new
  path), edit the ONE destination below and redeploy — the printed QR keeps
  working, no reprint needed.
  Three redundant forwards below: (1) meta refresh, (2) JS location.replace,
  (3) a visible <noscript> link. So it works with or without JavaScript.
  ============================================================================
-->
<meta http-equiv="refresh" content="0; url=/intake">
<title>Redirecting to SENTINEL…</title>
<link rel="canonical" href="/intake">
<style>
  :root{
    --bg:#141b26;--ink:#e6edf3;--dim:#9aa7b4;--acc:#4aa3ff;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:32px}
  .brand{font-size:30px;font-weight:800;letter-spacing:2px}
  .brand .s{color:var(--acc)}
  p{color:var(--dim);font-size:15px;margin-top:14px}
  a{color:var(--acc);font-weight:700}
</style>
</head>
<body>
  <div>
    <div class="brand"><span class="s">SENTINEL</span></div>
    <p>Taking you to the contact form…</p>
    <noscript>
      <p>JavaScript is off. <a href="/intake">Tap here to continue to the SENTINEL contact form</a>.</p>
    </noscript>
  </div>
  <script>
    // Immediate, history-clean forward (backs out cleanly, doesn't trap the Back button).
    window.location.replace("/intake");
  </script>
</body>
</html>
